name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

      - name: Create .env.production file
        run: |
          echo "NEXT_PUBLIC_USER1_USERNAME=${{ secrets.NEXT_PUBLIC_USER1_USERNAME }}" >> .env.production
          echo "NEXT_PUBLIC_USER1_PASSWORD=${{ secrets.NEXT_PUBLIC_USER1_PASSWORD }}" >> .env.production
          echo "NEXT_PUBLIC_USER2_USERNAME=${{ secrets.NEXT_PUBLIC_USER2_USERNAME }}" >> .env.production
          echo "NEXT_PUBLIC_USER2_PASSWORD=${{ secrets.NEXT_PUBLIC_USER2_PASSWORD }}" >> .env.production
          echo "NEXT_PUBLIC_ADMIN_USERNAME=${{ secrets.NEXT_PUBLIC_ADMIN_USERNAME }}" >> .env.production
          echo "NEXT_PUBLIC_ADMIN_PASSWORD=${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}" >> .env.production

      - name: Build
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MILLTURN_VARDIYA }}
          channelId: live
          projectId: millturn-vardiya
